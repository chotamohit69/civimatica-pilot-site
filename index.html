<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Civimatica · Milan Street Perception Pilot</title>

  <!-- Leaflet 1.9.4 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Three.js 0.169.0 via Importmap -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>

  <!-- Dashboard Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Header -->
  <header class="top-header">
    <div class="brand-section">
      <div class="logo-badge">
        <span class="dot"></span>
        CIVIMATICA
      </div>
      <span class="pilot-tag">Milan Pilot</span>
      <div class="source-info-note">
        Video inference benchmark (YouTube i84Ak9XpUUs) · Route rebuilt from on-screen street names + OpenStreetMap · No GNSS
      </div>
    </div>
    <div class="header-meta">
      <div class="device-badge">Jetson Orin Nano 8 GB</div>
    </div>
  </header>

  <!-- Global Playback & Scrubber Controls -->
  <div class="playback-bar">
    <div class="playback-controls">
      <div class="ctrl-group">
        <button class="btn-ctrl" id="btn-play-toggle">► Play</button>
        <div class="speed-pills">
          <button class="speed-pill active" data-speed="1">1x</button>
          <button class="speed-pill" data-speed="4">4x</button>
          <button class="speed-pill" data-speed="16">16x</button>
          <button class="speed-pill" data-speed="64">64x</button>
        </div>
        <div class="time-display" id="time-display">00:00 / --:--</div>
      </div>
      <div class="ctrl-group">
        <div class="street-pill" id="street-pill">Connecting route...</div>
      </div>
    </div>

    <!-- Scrubber with Street Bands -->
    <div class="scrubber-wrap" id="scrubber-wrap">
      <div class="scrubber-bands" id="scrubber-bands"></div>
      <div class="scrubber-progress" id="scrubber-progress"></div>
      <div class="scrubber-playhead" id="scrubber-playhead"></div>
    </div>
  </div>

  <!-- Navigation Bar -->
  <nav class="nav-bar">
    <button class="nav-tab active" data-section="street">Street 3D</button>
    <button class="nav-tab" data-section="overview">Overview</button>
    <button class="nav-tab" data-section="map">2D Map</button>
    <button class="nav-tab" data-section="cameras">Cameras &amp; Rig</button>
    <button class="nav-tab" data-section="signs">Signs</button>
    <button class="nav-tab" data-section="parking">Parking</button>
    <button class="nav-tab" data-section="device">Model &amp; Device</button>
    <button class="nav-tab" data-section="privacy">Privacy</button>
  </nav>

  <!-- Section 2: Street (Centrepiece, 3D Clay Model) -->
  <main class="view-container active" id="view-street"></main>

  <!-- Section 1: Overview -->
  <main class="view-container" id="view-overview"></main>

  <!-- Section 3: 2D Map -->
  <main class="view-container" id="view-map"></main>

  <!-- Section 4: Cameras & Rig -->
  <main class="view-container" id="view-cameras"></main>

  <!-- Section 5: Signs -->
  <main class="view-container" id="view-signs"></main>

  <!-- Section 6: Parking -->
  <main class="view-container" id="view-parking"></main>

  <!-- Section 7: Model & Device -->
  <main class="view-container" id="view-device"></main>

  <!-- Section 8: Privacy -->
  <main class="view-container" id="view-privacy"></main>

  <!-- Main Application Entrypoint -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
