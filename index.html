<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ee">
  <meta name="color-scheme" content="light">
  <title>Milan pilot · Civimatica</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>
</head>
<body>
  <main class="app">
    <div id="map" class="map" aria-label="Survey map"></div>

    <aside id="panel" class="panel" aria-label="Survey data"></aside>

    <div class="top-bar map-actions" aria-label="Map actions"></div>

    <div id="detail" class="detail" hidden aria-live="polite"></div>

    <div class="brand-chip credit" aria-hidden="true">
      <span class="mark"><i></i><i></i><i></i></span>
      <span>Civimatica</span>
    </div>

    <div id="state-loading" class="state-panel state-loading">
      <div class="state-card">
        <span class="state-spinner" aria-hidden="true"></span>
        <p class="state-message">Loading Milan pilot survey…</p>
      </div>
    </div>

    <div id="state-error" class="state-panel state-error" hidden>
      <div class="state-card">
        <p class="state-message">Couldn't load survey data. Reload the page to retry.</p>
      </div>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/live.js"></script>
</body>
</html>
